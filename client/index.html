<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banana Quiz Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Banana Quiz Challenge</h1>
    <p class="tagline">Enter the missing digit before the banana notices.</p>
  </header>

  <main>
    <section id="question-box" class="card">
      <h2>Question</h2>
      <p id="status">Loading the banana...</p>
      <button id="load-raw" type="button">Fetch a raw question</button>
      <pre id="raw-output" class="code-output" hidden></pre>
      <img id="question-image" alt="banana question" hidden>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
