<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banana Quiz Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Banana Quiz Challenge</h1>
        <p class="tagline">Enter the missing digit before the banana notices.</p>
      </div>
      <div id="user-bar" class="user-bar" hidden>
        <span>Playing as <strong id="who"></strong></span>
        <button id="logout" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main>
    <section id="auth-box" class="card">
      <h2>Who are you?</h2>
      <div class="auth-grid">
        <form id="login-form">
          <h3>Log in</h3>
          <label for="login-user">Username</label>
          <input id="login-user" name="username" autocomplete="username" required>
          <label for="login-pass">Password</label>
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Log in</button>
        </form>
        <form id="register-form">
          <h3>Register</h3>
          <label for="register-user">Username</label>
          <input id="register-user" name="username" autocomplete="username" required>
          <label for="register-pass">Password (8+ characters)</label>
          <input id="register-pass" name="password" type="password" minlength="8" autocomplete="new-password" required>
          <button type="submit">Create account</button>
        </form>
      </div>
      <p id="auth-status" class="feedback" hidden></p>
    </section>

    <section id="question-box" class="card" hidden>
      <h2>Question</h2>
      <p id="status">Loading the banana...</p>
      <img id="question-image" alt="banana question" hidden>
      <form id="answer-form" hidden>
        <label for="answer-input">Enter the missing digit</label>
        <input id="answer-input" name="answer" inputmode="numeric" maxlength="1" autocomplete="off" required>
        <button type="submit">Submit answer</button>
      </form>
      <p id="feedback" class="feedback" hidden></p>
      <p id="score-line" class="score-line" hidden>Score: 0</p>
      <button id="new-question" type="button">New question</button>
    </section>

    <section id="leaderboard-box" class="card" hidden>
      <h2>Leaderboard</h2>
      <table class="leaderboard">
        <thead>
          <tr><th>#</th><th>Player</th><th>Score</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <p id="leaderboard-note" class="muted" hidden>The leaderboard service is not answering, scores are local only.</p>
    </section>

    <section id="feed-box" class="card" hidden>
      <h2>Live activity</h2>
      <ul id="feed-list" class="feed"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
