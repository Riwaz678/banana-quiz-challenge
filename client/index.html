<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banana Quiz Challenge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Banana Quiz Challenge</h1>
    <p class="tagline">Enter the missing digit before the banana notices.</p>
  </header>

  <main>
    <section id="question-box" class="card">
      <h2>Question</h2>
      <p id="status">Loading the banana...</p>
      <img id="question-image" alt="banana question" hidden>
      <form id="answer-form" hidden>
        <label for="answer-input">Enter the missing digit</label>
        <input id="answer-input" name="answer" inputmode="numeric" maxlength="1" autocomplete="off" required>
        <button type="submit">Submit answer</button>
      </form>
      <p id="feedback" class="feedback" hidden></p>
      <p id="score-line" class="score-line" hidden>Score: 0</p>
      <button id="new-question" type="button">New question</button>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
